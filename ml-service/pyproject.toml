[project]
name = "face-attendance-ml"
version = "0.1.0"
description = "FastAPI Face Recognition Service using InsightFace & ArcFace"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python-headless>=4.9.0.80",
    "onnxruntime>=1.18.0",
    "insightface>=0.7.3",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
